name: Build Android TV APK

on:
  push:
    branches: [main, "codex/**"]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Validate bundled data
        run: python3 scripts/build_payload.py --version 2026091301 --asset-output app/src/main/assets/payload.json
      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Build installable debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SIEA-Prayer-Display-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

