name: Deploy Online Simulator

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "data/payload.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_run:
    workflows: ["Validate and Publish Timetable"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test web timing engine
        run: node --test web/prayer-engine.test.js
      - name: Check browser scripts
        run: |
          node --check web/app.js
          node --check web/admin.js
          node --check web/sw.js
      - name: Prepare site
        run: |
          mkdir -p _site/data
          cp -R web/. _site/
          cp data/payload.json _site/data/payload.json
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
