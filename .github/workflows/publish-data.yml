name: Validate and Publish Timetable

on:
  push:
    branches: [main]
    paths:
      - "data/timetable.csv"
      - "data/content.csv"
      - "scripts/build_payload.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate validated JSON
        run: python3 scripts/build_payload.py
      - name: Publish generated data
        run: |
          if git diff --quiet -- data/payload.json data/version.json; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/payload.json data/version.json
          git commit -m "data: publish validated timetable"
          git push

